plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solremote.dstv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solremote.dstv'
        minSdk 23
        targetSdk 33
        versionCode 3
        versionName '1.0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
