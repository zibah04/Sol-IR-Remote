plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solremote.dstv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solremote.livingroom'
        minSdk 23
        targetSdk 33
        versionCode 6
        versionName '1.2.0'
        testInstrumentationRunner (project.findProperty('testRunner') ?: 'com.solremote.dstv.DigitRenderingInstrumentation')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
